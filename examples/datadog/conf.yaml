# Example Datadog Agent SNMP configuration for the simulator.
#
# On Ubuntu, copy the LIVE generated file from the simulator volume after
# you create devices:
#   docker compose exec simulator python manage.py simulator export-datadog
#   docker compose cp simulator:/data/datadog/conf.yaml /etc/datadog-agent/conf.d/snmp.d/conf.yaml
#
# This checked-in example matches a three-device lab:
#   device-001 router   10.200.1.1  HIGH      UP
#   device-002 switch   10.200.1.2  MEDIUM    UP
#   device-003 firewall 10.200.1.3  LOW       DOWN (unreachable)

init_config:
  loader: core
  use_device_id_as_hostname: true

instances:
  - ip_address: '10.200.1.1'
    port: 161
    snmp_version: 2
    community_string: 'public'
    timeout: 3
    retries: 2
    tags:
      - 'device_id:device-001'
      - 'device_type:router'
      - 'traffic_profile:high'
      - 'vendor:cisco'
      - 'env:snmp-lab'

  - ip_address: '10.200.1.2'
    port: 161
    snmp_version: 2
    community_string: 'public'
    timeout: 3
    retries: 2
    tags:
      - 'device_id:device-002'
      - 'device_type:switch'
      - 'traffic_profile:medium'
      - 'vendor:cisco'
      - 'env:snmp-lab'

  - ip_address: '10.200.1.3'
    port: 161
    snmp_version: 2
    community_string: 'public'
    timeout: 3
    retries: 2
    tags:
      - 'device_id:device-003'
      - 'device_type:firewall'
      - 'traffic_profile:low'
      - 'vendor:cisco'
      - 'lab_status:unreachable'
      - 'env:snmp-lab'
